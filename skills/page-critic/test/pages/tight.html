<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Test page that looks fine as it stands, but breaks when the text gets longer. See test/run.mjs. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tight page</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: Georgia, serif; font-size: 18px; line-height: 1.5; color: #1c1f26; background: #faf3e3; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 16px; }
  p { margin: 0 0 16px; }
  nav { display: flex; gap: 16px; }
  a { color: #0b4f6c; }
  nav a { padding: 12px 0; min-height: 44px; min-width: 44px; }
  /* The label has a fixed width and a fixed font. The text fits right now, but not when it gets a third longer. */
  .label { display: inline-block; width: 200px; padding: 12px 0; white-space: nowrap; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace; font-size: 16px; line-height: 24px; }
</style>
</head>
<body>
<nav aria-label="Main menu">
  <a href="/tight">Cases</a><a href="/tight">Topics</a><a href="/tight">Help</a>
</nav>
<main>
  <h1>The page only holds as long as the text is short</h1>
  <p>Nothing here allows for long words, and the label below has no room to spare.</p>
  <a class="label" href="/tight">Shipping overview</a>
</main>
</body>
</html>
